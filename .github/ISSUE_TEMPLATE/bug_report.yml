name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the P&L tab\n2. Pick 7 days\n3. ..."
  - type: input
    id: browser
    attributes:
      label: Browser and Kaashify version
      placeholder: "Chrome 141, Kaashify 1.3.0 (shown in the footer)"
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug info (optional)
      description: Settings → Save debug info, then attach the file. It has no amounts and no key.
